<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tray Rotation Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    body {
      background: #1f4f6f;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
      user-select: none;
    }
    .card {
      width: 288px;
      height: 288px;
      background: linear-gradient(145deg, #1a4563, #235f8a);
      border-radius: 1.75rem;
      box-shadow:
        8px 8px 20px #143a57,
        -8px -8px 20px #2e7bbf;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1.5rem;
      color: white;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.1em;
      text-shadow: 0 0 4px rgba(255 255 255 / 0.3);
      margin-bottom: 1.5rem;
    }
    .header i {
      font-size: 1.25rem;
      filter: drop-shadow(0 0 2px rgba(255 255 255 / 0.6));
    }
    .dial-outer {
      position: relative;
      width: 192px;
      height: 192px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1f4f6f, #1a4563);
      border: 2px solid rgba(255 255 255 / 0.25);
      box-shadow:
        inset 6px 6px 12px #143a57,
        inset -6px -6px 12px #2e7bbf,
        0 0 15px rgba(10, 170, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .ticks-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .tick {
      position: absolute;
      width: 2px;
      height: 8px;
      background: rgba(255 255 255 / 0.35);
      top: 6px;
      left: 50%;
      border-radius: 1px;
      transform-origin: center 24px;
      filter: drop-shadow(0 0 1px rgba(255 255 255 / 0.3));
    }
    .dial-inner {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a4563, #235f8a);
      box-shadow:
        inset 10px 10px 20px #143a57,
        inset -10px -10px 20px #2e7bbf;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
      user-select: none;
      transition: background 0.3s ease;
    }
    .indicator-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      top: 40px;
      left: 56px;
      box-shadow:
        0 0 10px 3px #a0cfff,
        0 0 15px 6px #0af;
      transition: box-shadow 0.3s ease;
    }
    .speed-label {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      text-shadow: 0 0 6px rgba(255 255 255 / 0.4);
    }
    .speed-number {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 5.8rem;
      line-height: 1;
      display: flex;
      align-items: flex-start;
      user-select: none;
      text-shadow:
        0 0 6px rgba(10, 170, 255, 0.8),
        0 0 12px rgba(10, 170, 255, 0.6);
    }
    .speed-number sup {
      font-size: 1.6rem;
      margin-top: 0.3em;
      font-weight: 700;
      user-select: none;
      text-shadow:
        0 0 6px rgba(10, 170, 255, 0.8),
        0 0 12px rgba(10, 170, 255, 0.6);
    }
    .controls {
      margin-top: 2.5rem;
      width: 100%;
      padding: 0 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    .btn-minus, .btn-plus {
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 2.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px transparent;
      user-select: none;
      border: none;
      outline-offset: 2px;
    }
    .btn-minus {
      background: rgba(255 255 255 / 0.3);
      color: white;
      box-shadow: inset 3px 3px 8px #143a57, inset -3px -3px 8px #2e7bbf;
    }
    .btn-minus:hover,
    .btn-minus:focus-visible {
      background: rgba(255 255 255 / 0.45);
      box-shadow: inset 4px 4px 12px #0c2a3f, inset -4px -4px 12px #2e7bbf;
    }
    .btn-plus {
      background: #0af;
      color: white;
      box-shadow: 0 0 14px #0af;
    }
    .btn-plus:hover,
    .btn-plus:focus-visible {
      background: #33bbff;
      box-shadow: 0 0 20px #33bbff;
    }
    .progress-bar-container {
      position: relative;
      flex-grow: 1;
      height: 6px;
      background: rgba(255 255 255 / 0.3);
      border-radius: 9999px;
      margin: 0 1.5rem;
      overflow: hidden;
      box-shadow:
        inset 1px 1px 3px rgba(255 255 255 / 0.4),
        inset -1px -1px 3px rgba(0 0 0 / 0.2);
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 20%;
      background: #0af;
      border-radius: 9999px;
      box-shadow:
        0 0 10px #0af,
        0 0 20px #0af;
      transition: width 0.3s ease;
    }
    /* Responsive */
    @media (max-width: 400px) {
      .card {
        width: 90vw;
        height: auto;
        padding-bottom: 2rem;
      }
      .dial-outer {
        width: 85vw;
        height: 85vw;
        max-width: 192px;
        max-height: 192px;
      }
      .dial-inner {
        width: 70vw;
        height: 70vw;
        max-width: 160px;
        max-height: 160px;
      }
      .btn-minus, .btn-plus {
        width: 48px;
        height: 48px;
        font-size: 2.25rem;
      }
      .progress-bar-container {
        margin: 0 1rem;
        height: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="card" role="region" aria-label="Tray rotation speed control">
    <div class="header">
      <i class="fas fa-sync-alt" aria-hidden="true"></i>
      <span>TRAY ROTATION</span>
    </div>

    <div class="dial-outer" aria-live="polite" aria-atomic="true" aria-label="Speed dial">
      <div class="ticks-container" aria-hidden="true"></div>
      <div class="dial-inner">
        <div class="indicator-dot"></div>
        <div class="speed-label">SPEED</div>
        <div class="speed-number" id="speedValue">
          1<sup>/5</sup>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn-minus" aria-label="Decrease speed" id="btnMinus" tabindex="0">−</button>
      <div class="progress-bar-container" aria-hidden="true">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <button type="button" class="btn-plus" aria-label="Increase speed" id="btnPlus" tabindex="0">+</button>
    </div>
  </div>

  <script>
    // Generate 36 tick marks evenly spaced around the dial
    const ticksContainer = document.querySelector('.ticks-container');
    for (let i = 0; i < 36; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.transform = `rotate(${i * 10}deg) translateX(-50%)`;
      ticksContainer.appendChild(tick);
    }

    // Speed control logic (optional enhancement)
    const btnMinus = document.getElementById('btnMinus');
    const btnPlus = document.getElementById('btnPlus');
    const speedValue = document.getElementById('speedValue');
    const progressBar = document.getElementById('progressBar');

    let speed = 1;
    const maxSpeed = 5;
    const minSpeed = 1;

    function updateUI() {
      speedValue.innerHTML = `${speed}<sup>/5</sup>`;
      const percent = ((speed - minSpeed) / (maxSpeed - minSpeed)) * 100;
      progressBar.style.width = `${percent}%`;
    }

    btnMinus.addEventListener('click', () => {
      if (speed > minSpeed) {
        speed--;
        updateUI();
      }
    });

    btnPlus.addEventListener('click', () => {
      if (speed < maxSpeed) {
        speed++;
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
